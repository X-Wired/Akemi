# Akemi — golangci-lint configuration
# See: https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  go: "1.25.12"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - Akemi

linters:
  enable:
    # Default linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional linters
    - misspell
    - unconvert
    - unparam
    - whitespace
    - bodyclose
    - nilerr
    - noctx
    - prealloc
    - makezero

  disable:
    - depguard # Allow all dependencies during Phase 1 refactor
    - exhaustive # Too noisy for existing code
    - gochecknoglobals # We have intentional globals for config/session state

  settings:
    govet:
      # `check-shadowing` was removed; shadow is now an explicit analyzer.
      enable:
        - shadow
      enable-all: true
    misspell:
      locale: US
      ignore-words:
        - akemi # Project name
    staticcheck:
      checks: ["all", "-SA1019"] # Allow deprecated usage during migration

  exclusions:
    rules:
      # Exclude some linters from test files.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - noctx

      # Exclude known false positives from legacy code.
      - path: internal/
        text: "SA1019:" # Allow deprecated during migration
        linters:
          - staticcheck

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
